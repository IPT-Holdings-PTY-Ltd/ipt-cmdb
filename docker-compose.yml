services:
  cmdb:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATA_DIR: /app/data
      DATABASE_URL: postgresql://cmdb:${POSTGRES_PASSWORD:-cmdb}@postgres:5432/cmdb
      DATABASE_SEED_MODE: demo
      CMDB_MIGRATION_LOCK_TIMEOUT_MS: ${CMDB_MIGRATION_LOCK_TIMEOUT_MS:-60000}
      CMDB_MIGRATION_STATEMENT_TIMEOUT_MS: ${CMDB_MIGRATION_STATEMENT_TIMEOUT_MS:-900000}
      CMDB_PROCESS_ROLE: ${CMDB_PROCESS_ROLE:-combined}
      CMDB_IMAGE_DIGEST: ${CMDB_IMAGE_DIGEST:-unknown}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUTH_MODE: ${AUTH_MODE:-local}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-}
      LOCAL_LOGIN_IDENTIFIER_LIMIT: ${LOCAL_LOGIN_IDENTIFIER_LIMIT:-5}
      LOCAL_LOGIN_IDENTIFIER_WINDOW_SECONDS: ${LOCAL_LOGIN_IDENTIFIER_WINDOW_SECONDS:-900}
      LOCAL_LOGIN_SOURCE_LIMIT: ${LOCAL_LOGIN_SOURCE_LIMIT:-20}
      LOCAL_LOGIN_SOURCE_WINDOW_SECONDS: ${LOCAL_LOGIN_SOURCE_WINDOW_SECONDS:-900}
      LOCAL_LOGIN_PENDING_TTL_SECONDS: ${LOCAL_LOGIN_PENDING_TTL_SECONDS:-120}
      LOCAL_LOGIN_THROTTLE_AUDIT_SECONDS: ${LOCAL_LOGIN_THROTTLE_AUDIT_SECONDS:-300}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      ALLOW_LOCAL_DEVELOPMENT: "false"
      # Local demo key only. Set MFA_ENCRYPTION_KEY from Key Vault/container secrets in production.
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-Y21kYi1sb2NhbC1tZmEtZGV2ZWxvcG1lbnQta2V5ISE=}
      LOCAL_MFA_POLICY: ${LOCAL_MFA_POLICY:-optional}
      NOTIFICATION_WORKER_ENABLED: ${NOTIFICATION_WORKER_ENABLED:-false}
      NOTIFICATION_WORKER_INTERVAL_SECONDS: ${NOTIFICATION_WORKER_INTERVAL_SECONDS:-60}
      INTEGRATION_WORKER_ENABLED: ${INTEGRATION_WORKER_ENABLED:-false}
      INTEGRATION_WORKER_INTERVAL_SECONDS: ${INTEGRATION_WORKER_INTERVAL_SECONDS:-2}
      INTEGRATION_ALERT_RECIPIENTS: ${INTEGRATION_ALERT_RECIPIENTS:-}
      NCENTRAL_BASE_URL: ${NCENTRAL_BASE_URL:-}
      NCENTRAL_USER_API_TOKEN: ${NCENTRAL_USER_API_TOKEN:-}
      NCENTRAL_USER_API_TOKEN_FILE: ${NCENTRAL_USER_API_TOKEN_FILE:-}
      NCENTRAL_API_TOKEN: ${NCENTRAL_API_TOKEN:-}
      NCENTRAL_PAGE_SIZE: ${NCENTRAL_PAGE_SIZE:-250}
      NCENTRAL_GRAPHQL_ENABLED: ${NCENTRAL_GRAPHQL_ENABLED:-false}
      NCENTRAL_GRAPHQL_ENDPOINT: ${NCENTRAL_GRAPHQL_ENDPOINT:-https://api.n-able.com/graphql}
      NCENTRAL_GRAPHQL_API_TOKEN: ${NCENTRAL_GRAPHQL_API_TOKEN:-}
      NCENTRAL_GRAPHQL_API_TOKEN_FILE: ${NCENTRAL_GRAPHQL_API_TOKEN_FILE:-}
      NCENTRAL_GRAPHQL_PAGE_SIZE: ${NCENTRAL_GRAPHQL_PAGE_SIZE:-100}
      NCENTRAL_GRAPHQL_SERVER_ID: ${NCENTRAL_GRAPHQL_SERVER_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/api/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cmdb
      POSTGRES_USER: cmdb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cmdb}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cmdb-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmdb -d cmdb"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  cmdb-postgres:

# Docker Desktop can otherwise return Microsoft IPv6 addresses to an IPv4-only
# container. A dual-stack project network keeps Entra and Graph reachable.
networks:
  default:
    enable_ipv6: true
