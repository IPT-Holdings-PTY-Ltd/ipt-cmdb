services:
  cmdb:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATA_DIR: /app/data
      DATABASE_URL: postgresql://cmdb:cmdb@postgres:5432/cmdb
      DATABASE_SEED_MODE: demo
      AUTH_MODE: ${AUTH_MODE:-local}
      ALLOW_LOCAL_DEVELOPMENT: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/api/v2/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cmdb
      POSTGRES_USER: cmdb
      POSTGRES_PASSWORD: cmdb
    ports:
      - "5432:5432"
    volumes:
      - cmdb-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmdb -d cmdb"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  cmdb-postgres:
