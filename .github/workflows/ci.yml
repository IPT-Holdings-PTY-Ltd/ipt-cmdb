name: CI

on:
  workflow_call:
    inputs:
      test_ref:
        description: Commit or ref to validate
        required: false
        type: string
        default: ''
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TEST_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.test_ref || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Lint Python
        run: python -m ruff check app.py backend src scripts test
      - name: Check Python formatting
        run: python -m ruff format --check app.py backend src scripts test
      - name: Type-check Python
        run: python -m mypy app.py backend src scripts
      - name: Run Python tests with branch coverage
        run: |
          python -m coverage run -m unittest discover -s test -v
          python -m coverage report
      - name: Verify blank PostgreSQL bootstrap
        run: python scripts/verify_blank_postgres.py --admin-url postgresql://postgres:postgres@localhost:5432/postgres
      - name: Verify forward-only PostgreSQL upgrade
        run: python scripts/verify_postgres_upgrade.py --admin-url postgresql://postgres:postgres@localhost:5432/postgres

      - name: Install frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: Run Node tests
        run: npm test
      - name: Lint frontend
        run: npm run lint
      - name: Type-check frontend
        run: npm run typecheck
      - name: Build frontend
        run: npm run build

      - name: Build container
        run: docker build --tag ipt-cmdb:ci .

  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.test_ref || github.sha }}
      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-security.txt
      - name: Install security tooling
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-security.txt
      - name: Scan Python code
        run: python -m bandit -r app.py backend src scripts -ll -ii
      - name: Audit production dependencies
        continue-on-error: true
        run: python -m pip_audit --requirement requirements.txt
