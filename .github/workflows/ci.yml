name: CI

on:
  workflow_call:
    inputs:
      test_ref:
        description: Commit or ref to validate
        required: false
        type: string
        default: ''
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TEST_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.test_ref || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Lint Python
        run: python -m ruff check app.py backend src scripts test
      - name: Check Python formatting
        run: python -m ruff format --check app.py backend src scripts test
      - name: Type-check Python
        run: python -m mypy app.py backend src scripts
      - name: Run Python tests with branch coverage
        run: |
          python -m coverage run -m unittest discover -s test -v
          python -m coverage report
      - name: Verify blank PostgreSQL bootstrap
        run: python scripts/verify_blank_postgres.py --admin-url postgresql://postgres:postgres@localhost:5432/postgres
      - name: Verify forward-only PostgreSQL upgrade
        run: python scripts/verify_postgres_upgrade.py --admin-url postgresql://postgres:postgres@localhost:5432/postgres
      - name: Validate Compose deployment models
        env:
          CMDB_IMAGE: ipt-cmdb:ci
          PUBLIC_BASE_URL: https://cmdb.example.test
          BOOTSTRAP_ADMIN_EMAIL: admin@example.test
          DATABASE_URL_SECRET_FILE: /tmp/database-url.txt
          MFA_ENCRYPTION_KEY_SECRET_FILE: /tmp/mfa-encryption-key.txt
          BOOTSTRAP_ADMIN_PASSWORD_SECRET_FILE: /tmp/bootstrap-admin-password.txt
          CMDB_SECRET_DIRECTORY: /tmp/cmdb-secrets
          CMDB_BACKUP_DIRECTORY: /tmp/cmdb-backups
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f compose.production.yml config --quiet
          docker compose -f compose.appliance.yml config --quiet
          docker compose -f compose.production.yml -f compose.worker.yml config --quiet

      - name: Install frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: Run Node tests
        run: npm test
      - name: Lint frontend
        run: npm run lint
      - name: Type-check frontend
        run: npm run typecheck
      - name: Build frontend
        run: npm run build

      - name: Build container
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          docker build \
            --build-arg "CMDB_VERSION=$version" \
            --build-arg "CMDB_SOURCE_COMMIT=$(git rev-parse HEAD)" \
            --tag "ipt-cmdb:$version-ci" \
            .

      - name: Smoke-test a fresh compact-appliance install
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          sh scripts/initialize-appliance.sh \
            admin@example.test \
            ci-smoke \
            http://127.0.0.1:3011 \
            "ipt-cmdb:$version-ci" \
            3011
          environment=".appliance/ci-smoke/.env.appliance"
          docker compose \
            --env-file "$environment" \
            -f compose.appliance.yml \
            up -d
          container_id="$(
            docker compose \
              --env-file "$environment" \
              -f compose.appliance.yml \
              ps -q cmdb
          )"
          if [[ -z "$container_id" ]]; then
            echo "The compact-appliance CMDB container was not created." >&2
            exit 1
          fi
          CMDB_CONTAINER_ID="$container_id" EXPECTED_VERSION="$version" python - <<'PY'
          import json
          import os
          import subprocess
          import time
          import urllib.error
          import urllib.request

          base_url = "http://127.0.0.1:3011"
          container_id = os.environ["CMDB_CONTAINER_ID"]
          expected_version = os.environ["EXPECTED_VERSION"]
          deadline = time.monotonic() + 180
          last_error = "the service did not respond"

          def read_container_state() -> tuple[dict, int]:
              result = subprocess.run(
                  [
                      "docker",
                      "inspect",
                      "--format",
                      '{"state":{{json .State}},"restartCount":{{.RestartCount}}}',
                      container_id,
                  ],
                  check=False,
                  capture_output=True,
                  text=True,
                  timeout=5,
              )
              if result.returncode != 0:
                  raise RuntimeError("Docker could not inspect the CMDB container")
              payload = json.loads(result.stdout)
              state = payload.get("state")
              restart_count = payload.get("restartCount")
              if not isinstance(state, dict) or not isinstance(restart_count, int):
                  raise RuntimeError("Docker returned invalid CMDB container state")
              return state, restart_count

          def read_json(path: str) -> dict:
              try:
                  with urllib.request.urlopen(
                      f"{base_url}{path}",
                      timeout=5,
                  ) as response:
                      if response.status != 200:
                          raise RuntimeError(f"{path} returned HTTP {response.status}")
                      payload = json.load(response)
                      if not isinstance(payload, dict):
                          raise RuntimeError(f"{path} returned an invalid JSON document")
                      return payload
              except urllib.error.HTTPError as error:
                  raise RuntimeError(f"{path} returned HTTP {error.code}") from None

          while time.monotonic() < deadline:
              try:
                  state, restart_count = read_container_state()
                  health = state.get("Health")
                  if state.get("Running") is not True:
                      raise RuntimeError("the CMDB container is not running")
                  if not isinstance(health, dict) or health.get("Status") != "healthy":
                      raise RuntimeError("the CMDB container is not healthy yet")
                  if restart_count != 0:
                      raise RuntimeError("the fresh CMDB container restarted")
                  live = read_json("/api/live")
                  ready = read_json("/api/ready")
                  if live.get("status") != "alive":
                      raise RuntimeError("/api/live did not report alive")
                  if live.get("applicationVersion") != expected_version:
                      raise RuntimeError(
                          "/api/live reported an unexpected application version"
                      )
                  if ready.get("applicationVersion") != expected_version:
                      raise RuntimeError(
                          "/api/ready reported an unexpected application version"
                      )
                  if ready.get("status") != "ready":
                      raise RuntimeError("/api/ready did not report ready")
                  if ready.get("databaseAvailable") is not True:
                      raise RuntimeError("/api/ready did not report database availability")
                  if ready.get("schemaCurrent") is not True:
                      raise RuntimeError("/api/ready did not report the current schema")
                  if ready.get("schemaVersion") != ready.get("expectedSchemaVersion"):
                      raise RuntimeError("/api/ready reported a schema version mismatch")
              except (
                  json.JSONDecodeError,
                  OSError,
                  RuntimeError,
                  TypeError,
                  ValueError,
              ) as error:
                  last_error = str(error) or type(error).__name__
                  time.sleep(2)
                  continue

              print(
                  "Compact appliance is ready: "
                  f"version={ready['applicationVersion']} "
                  f"schema={ready['schemaVersion']}"
              )
              break
          else:
              raise SystemExit(
                  "Compact appliance did not become ready within 180 seconds: "
                  f"{last_error}"
              )
          PY

      - name: Diagnose failed compact-appliance smoke test
        if: failure()
        run: |
          environment=".appliance/ci-smoke/.env.appliance"
          if [[ -f "$environment" ]]; then
            docker compose \
              --env-file "$environment" \
              -f compose.appliance.yml \
              ps --all || true
            container_id="$(
              docker compose \
                --env-file "$environment" \
                -f compose.appliance.yml \
                ps -q cmdb 2>/dev/null || true
            )"
            if [[ -n "$container_id" ]]; then
              docker inspect \
                --format '{"state":{{json .State}},"restartCount":{{.RestartCount}}}' \
                "$container_id" || true
            fi
            docker compose \
              --env-file "$environment" \
              -f compose.appliance.yml \
              logs --no-color --timestamps --tail 300 || true
          fi

      - name: Clean up compact-appliance smoke test
        if: always()
        run: |
          environment=".appliance/ci-smoke/.env.appliance"
          if [[ -f "$environment" ]]; then
            docker compose \
              --env-file "$environment" \
              -f compose.appliance.yml \
              down --volumes --remove-orphans
          fi

  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.test_ref || github.sha }}
      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12
      - name: Validate Azure Bicep
        run: >-
          docker run --rm
          -v "$PWD:/workspace"
          -w /workspace
          mcr.microsoft.com/azure-cli:2.77.0
          az bicep build --file infra/main.bicep --stdout
          > /dev/null
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-security.txt
      - name: Install security tooling
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-security.txt
      - name: Scan Python code
        run: python -m bandit -r app.py backend src scripts -ll -ii
      - name: Audit production dependencies
        run: python -m pip_audit --requirement requirements.txt
