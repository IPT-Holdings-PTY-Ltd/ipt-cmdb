name: Publish release container image

on:
  workflow_call:
    inputs:
      version:
        description: Validated semantic version without a leading v
        required: true
        type: string
      release_tag:
        description: Validated semantic-version Git tag
        required: true
        type: string
      source_sha:
        description: Full commit SHA approved by the release workflow
        required: true
        type: string
    outputs:
      image_digest:
        description: Published multi-architecture image digest
        value: ${{ jobs.build-and-push.outputs.image_digest }}
      image_name:
        description: Normalized GHCR image name
        value: ${{ jobs.build-and-push.outputs.image_name }}

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-container-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build immutable release image
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_name: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}

      - name: Validate guarded release inputs
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "The reusable image workflow received an invalid semantic version." >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "The release tag must be v followed by the validated version." >&2
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The source reference must be a full lowercase commit SHA." >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]]; then
            echo "The checked-out commit does not match the approved source SHA." >&2
            exit 1
          fi

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Normalize image name
        id: image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite immutable release tags
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          for reference in "$IMAGE_NAME:$VERSION" "$IMAGE_NAME:sha-$SOURCE_SHA"; do
            if docker buildx imagetools inspect "$reference" > /dev/null 2>&1; then
              echo "Immutable image reference already exists: $reference" >&2
              exit 1
            fi
          done

      - name: Create immutable image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=sha-${{ inputs.source_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.source_sha }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.ref.name=${{ inputs.release_tag }}

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CMDB_VERSION=${{ inputs.version }}
            CMDB_SOURCE_COMMIT=${{ inputs.source_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest published image
        uses: actions/attest@v4.2.0
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summarize immutable image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          {
            echo "### Published immutable release image"
            echo "- Exact reference: \`$IMAGE_NAME@$IMAGE_DIGEST\`"
            echo "- Version tag: \`$IMAGE_NAME:$VERSION\`"
            echo "- Commit tag: \`$IMAGE_NAME:sha-$SOURCE_SHA\`"
            echo "- Stable channel tags are intentionally not updated by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
