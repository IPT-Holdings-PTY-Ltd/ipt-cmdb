version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      vite-toolchain:
        patterns:
          - "vite"
          - "@vitejs/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
