# Optional worker split for compose.production.yml or compose.appliance.yml.
# Apply only after the web service has initialized and /api/ready succeeds.
services:
  cmdb:
    environment:
      CMDB_PROCESS_ROLE: web
      CMDB_IMAGE_DIGEST: ${CMDB_IMAGE_DIGEST:-unknown}

  worker:
    image: ${CMDB_IMAGE:?Set CMDB_IMAGE to the same immutable image as the web service}
    command: ["python", "-m", "backend.worker"]
    # The worker does not expose HTTP. Disable the image-level web health check
    # so Compose can wait for the process to remain running without probing port
    # 3000 inside this container.
    healthcheck:
      disable: true
    environment:
      DATA_DIR: /app/data
      DATABASE_URL_FILE: /run/secrets/database_url
      DATABASE_SEED_MODE: empty
      CMDB_MIGRATION_LOCK_TIMEOUT_MS: ${CMDB_MIGRATION_LOCK_TIMEOUT_MS:-60000}
      CMDB_MIGRATION_STATEMENT_TIMEOUT_MS: ${CMDB_MIGRATION_STATEMENT_TIMEOUT_MS:-900000}
      CMDB_PROCESS_ROLE: worker
      CMDB_IMAGE_DIGEST: ${CMDB_IMAGE_DIGEST:-unknown}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Set BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
      MFA_ENCRYPTION_KEY_FILE: /run/secrets/mfa_encryption_key
      ALLOW_UI_DATABASE_CONFIG: "false"
      ALLOW_LOCAL_DEVELOPMENT: "false"
      NOTIFICATION_WORKER_ENABLED: ${NOTIFICATION_WORKER_ENABLED:-false}
      NOTIFICATION_WORKER_INTERVAL_SECONDS: ${NOTIFICATION_WORKER_INTERVAL_SECONDS:-60}
      INTEGRATION_WORKER_ENABLED: ${INTEGRATION_WORKER_ENABLED:-false}
      INTEGRATION_WORKER_INTERVAL_SECONDS: ${INTEGRATION_WORKER_INTERVAL_SECONDS:-2}
      INTEGRATION_ALERT_RECIPIENTS: ${INTEGRATION_ALERT_RECIPIENTS:-}
      NCENTRAL_BASE_URL: ${NCENTRAL_BASE_URL:-}
      NCENTRAL_USER_API_TOKEN: ${NCENTRAL_USER_API_TOKEN:-}
      NCENTRAL_USER_API_TOKEN_FILE: ${NCENTRAL_USER_API_TOKEN_FILE:-}
      NCENTRAL_API_TOKEN: ${NCENTRAL_API_TOKEN:-}
      NCENTRAL_PAGE_SIZE: ${NCENTRAL_PAGE_SIZE:-250}
    secrets:
      - database_url
      - bootstrap_admin_password
      - mfa_encryption_key
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: ${CMDB_WORKER_MEMORY_LIMIT:-512m}
    cpus: ${CMDB_WORKER_CPU_LIMIT:-0.5}
    restart: unless-stopped
    stop_grace_period: 30s
